<svg xmlns="http://www.w3.org/2000/svg" width="736" height="914" viewBox="0 0 736 914" role="img" aria-labelledby="title desc"><title id="title">Systems, software, AI, integration and experimentation.</title><desc id="desc">Systems &amp; infrastructure Linux, networking, security and automation. I work across the layers that make systems reliable, maintainable and easier to operate. Software &amp; interfaces Applications, developer tools and ways of interacting with computers. I care about how software feels to use and how it fits into real workflows. AI &amp; automation Exploring local AI, coding agents and automated workflows, with an interest in making useful capabilities easier to control and connect. Integration &amp; architecture Connecting applications, services and devices. I like understanding how the pieces work together, then making them easier to extend and debug. Experimentation A mix of hands-on engineering, research and prototypes. I enjoy learning unfamiliar systems, testing ideas and turning useful experiments into practical tools. RUST · SWIFT · NIX TYPESCRIPT · WAYLAND · PYTHON</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif}.flow{animation:flow 7s linear infinite}.scan{animation:scan 5s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-160}}@keyframes scan{0%,100%{opacity:.4}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.flow,.scan{animation:none}}</style><defs><linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d5e2e9"/><stop offset="1" stop-color="#adc3d0"/></linearGradient></defs><rect width="100%" height="100%" fill="#f5f7f8"/><g transform="translate(96 85) scale(.63)" aria-hidden="true"><path d="M-92.02,-21.00L21.50,15.96L21.50,29.96L-92.02,-7.00Z" fill="#adc3d0" stroke="#a5bac7" stroke-width=".8" stroke-linejoin="round"/><path d="M92.02,-7.00L92.02,7.00L21.50,29.96L21.50,15.96Z" fill="#86a3b6" stroke="#a5bac7" stroke-width=".8" stroke-linejoin="round"/><path d="M-21.50,-43.96L92.02,-7.00L21.5