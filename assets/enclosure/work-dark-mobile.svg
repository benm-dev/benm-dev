<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1073" viewBox="0 0 360 1073" role="img" aria-labelledby="title desc"><title id="title">Experience, development and research across Linux, remote interfaces and local AI.</title><desc id="desc">Linux systems Experience with RHEL infrastructure, offline patching and hardening. Building reproducible NixOS workstations with Wayland and remote access. Remote interfaces Developing a touch-first desktop experience for unfolded phones: streaming, session-aware input, side gestures and on-screen typing. Agent coordination Designing a PostgreSQL task ledger for coding agents: leased work, durable handoffs, isolated Git worktrees and serial integration. Local AI research Exploring local model serving on a DGX Spark, memory reclamation between workloads and agent-driven image workflows. System awareness Exploring how configuration, source, running components and functional checks connect, so people and coding agents can inspect the same system. RUST · SWIFT · NIX TYPESCRIPT · WAYLAND · PYTHON</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif}.flow{animation:flow 7s linear infinite}.scan{animation:scan 5s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-160}}@keyframes scan{0%,100%{opacity:.4}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.flow,.scan{animation:none}}</style><defs><linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3a5160"/><stop offset="1" stop-color="#253b48"/></linearGradient></defs><rect width="100%" height="100%" fill="#10151b"/><text x="23.5" y="47.5" fill="#172a35" font-size="23" font-weight="500" aria-hidden="true">Linux systems</text><text x="22.75" y="46.75" fill="#172a35" font-size="23" font-weight="500" aria-hidden="true">Linux systems</text><text x="22" y="46" fill="#e4edf2" font-size="23" font-weight="500">Linux systems</text><text x="22" y="77" fill="#a5b6c2" font-size="17" font-weight="400">Experience with RHEL infrastructure,</text><text x="