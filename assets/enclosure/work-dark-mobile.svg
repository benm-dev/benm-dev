<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1099" viewBox="0 0 360 1099" role="img" aria-labelledby="title desc"><title id="title">Systems, software, AI, integration and experimentation.</title><desc id="desc">Systems &amp; infrastructure Linux, networking, security and automation. I work across the layers that make systems reliable, maintainable and easier to operate. Software &amp; interfaces Applications, developer tools and ways of interacting with computers. I care about how software feels to use and how it fits into real workflows. AI &amp; automation Exploring local AI, coding agents and automated workflows, with an interest in making useful capabilities easier to control and connect. Integration &amp; architecture Connecting applications, services and devices. I like understanding how the pieces work together, then making them easier to extend and debug. Experimentation A mix of hands-on engineering, research and prototypes. I enjoy learning unfamiliar systems, testing ideas and turning useful experiments into practical tools. RUST · SWIFT · NIX TYPESCRIPT · WAYLAND · PYTHON</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif}.flow{animation:flow 7s linear infinite}.scan{animation:scan 5s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-160}}@keyframes scan{0%,100%{opacity:.4}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.flow,.scan{animation:none}}</style><defs><linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3a5160"/><stop offset="1" stop-color="#253b48"/></linearGradient></defs><rect width="100%" height="100%" fill="#10151b"/><text x="23.5" y="47.5" fill="#172a35" font-size="23" font-weight="500" aria-hidden="true">Systems &amp; infrastructure</text><text x="22.75" y="46.75" fill="#172a35" font-size="23" font-weight="500" aria-hidden="true">Systems &amp; infrastructure</text><text x="22" y="46" fill="#e4edf2" font-size="23" font-weight="500">Systems &amp; infrastructure</text><text x="22" y=