<svg xmlns="http://www.w3.org/2000/svg" width="360" height="758" viewBox="0 0 360 758" role="img" aria-labelledby="title desc"><title id="title">Current work: systems, interfaces, developer tooling and architecture in progress.</title><desc id="desc">Systems Reproducible Linux workstations, declarative configuration, Wayland desktops and remote access. Interfaces Desktop streaming for foldable devices, touch input and on-screen typing. Broader keyboard integration is in development. Developer tooling Application compatibility, agent and IDE integration, and automation around the workstation. Exploring An OS component model connecting configuration, capabilities, ownership and runtime evidence. Architecture in progress. RUST · SWIFT · NIX TYPESCRIPT · WAYLAND · PYTHON</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif}.flow{animation:flow 7s linear infinite}.scan{animation:scan 5s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-160}}@keyframes scan{0%,100%{opacity:.4}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.flow,.scan{animation:none}}</style><defs><linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3a5160"/><stop offset="1" stop-color="#253b48"/></linearGradient></defs><rect width="100%" height="100%" fill="#10151b"/><text x="23.5" y="47.5" fill="#172a35" font-size="23" font-weight="500" aria-hidden="true">Systems</text><text x="22.75" y="46.75" fill="#172a35" font-size="23" font-weight="500" aria-hidden="true">Systems</text><text x="22" y="46" fill="#e4edf2" font-size="23" font-weight="500">Systems</text><text x="22" y="77" fill="#a5b6c2" font-size="17" font-weight="400">Reproducible Linux workstations,</text><text x="22" y="103" fill="#a5b6c2" font-size="17" font-weight="400">declarative configuration, Wayland</text><text x="22" y="129" fill="#a5b6c2" font-size="17" font-weight="400">desktops and remote access.</text><path d="M22 183H338" stroke="#354957"/><text x="23.5" y="221.5" fill="#172a35" font-size="23" f