<svg xmlns="http://www.w3.org/2000/svg" width="360" height="465" viewBox="0 0 360 465" role="img" aria-labelledby="title desc"><title id="title">How the activity snapshot is counted.</title><desc id="desc">Commits authored on default branches of accessible owned repositories pushed during the window. Fork duplicates count once, as public if visible in a public repository. Pull requests and issues count items I opened during the window across accessible repositories. Dates use UTC. These are snapshot records, not the GitHub contribution-calendar total. Repository names and item details are omitted.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif}.flow{animation:flow 7s linear infinite}.scan{animation:scan 5s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-160}}@keyframes scan{0%,100%{opacity:.4}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.flow,.scan{animation:none}}</style><defs><linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3a5160"/><stop offset="1" stop-color="#253b48"/></linearGradient></defs><rect width="100%" height="100%" fill="#10151b"/><text x="22" y="34" fill="#a5b6c2" font-size="17" font-weight="400">Commits authored on default</text><text x="22" y="60" fill="#a5b6c2" font-size="17" font-weight="400">branches of accessible owned</text><text x="22" y="86" fill="#a5b6c2" font-size="17" font-weight="400">repositories pushed during the</text><text x="22" y="112" fill="#a5b6c2" font-size="17" font-weight="400">window. Fork duplicates count once,</text><text x="22" y="138" fill="#a5b6c2" font-size="17" font-weight="400">as public if visible in a public</text><text x="22" y="164" fill="#a5b6c2" font-size="17" font-weight="400">repository.</text><text x="22" y="209" fill="#a5b6c2" font-size="17" font-weight="400">Pull requests and issues count items</text><text x="22" y="235" fill="#a5b6c2" font-size="17" font-weight="400">I opened during the window across</text><text x="22" y="261" fill="#a5b6c2" font-size="17" font-weight="400">accessible repositories.</text><text x="22" y="306" fill="#a5b6c2" font-size="17" font-weight="400">Dates use UTC. These are snapshot</text><text x="22" y="332" fill="#a5b6c2" font-size="17" font-weight="400">records, not the GitHub</text><text x="22" y="358" fill="#a5b6c2" font-size="17" font-weight="400">contribution-calendar total.</text><text x="22" y="384" fill="#a5b6c2" font-size="17" font-weight="400">Repository names and item details</text><text x="22" y="410" fill="#a5b6c2" font-size="17" font-weight="400">are omitted.</text></svg>