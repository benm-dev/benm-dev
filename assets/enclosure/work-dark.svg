<svg xmlns="http://www.w3.org/2000/svg" width="736" height="600" viewBox="0 0 736 600" role="img" aria-labelledby="title desc"><title id="title">Current work: systems, interfaces, developer tooling and architecture in progress.</title><desc id="desc">Systems Reproducible Linux workstations, declarative configuration, Wayland desktops and remote access. Interfaces Desktop streaming for foldable devices, touch input and on-screen typing. Broader keyboard integration is in development. Developer tooling Application compatibility, agent and IDE integration, and automation around the workstation. Exploring An OS component model connecting configuration, capabilities, ownership and runtime evidence. Architecture in progress. RUST · SWIFT · NIX TYPESCRIPT · WAYLAND · PYTHON</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif}.flow{animation:flow 7s linear infinite}.scan{animation:scan 5s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-160}}@keyframes scan{0%,100%{opacity:.4}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.flow,.scan{animation:none}}</style><defs><linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3a5160"/><stop offset="1" stop-color="#253b48"/></linearGradient></defs><rect width="100%" height="100%" fill="#10151b"/><g transform="translate(96 85) scale(.63)" aria-hidden="true"><path d="M-92.02,-21.00L21.50,15.96L21.50,29.96L-92.02,-7.00Z" fill="#253b48" stroke="#354957" stroke-width=".8" stroke-linejoin="round"/><path d="M92.02,-7.00L92.02,7.00L21.50,29.96L21.50,15.96Z" fill="#172a35" stroke="#354957" stroke-width=".8" stroke-linejoin="round"/><path d="M-21.50,-43.96L92.02,-7.00L21.50,15.96L-92.02,-21.00Z" fill="url(#metal)" stroke="#354957" stroke-width=".8" stroke-linejoin="round"/><path d="M-50.74,-33.88L18.06,-11.48L18.06,-3.48L-50.74,-25.88Z" fill="#39758c"/><path d="M50.74,-22.12L50.74,-14.12L18.06,-3.48L18.06,-11.48Z" fill="#39758c"/><path d="M-18.06,-44.52L50.74,-22.12L18.06,-11.48L-50.74,-33.88Z" fill="#