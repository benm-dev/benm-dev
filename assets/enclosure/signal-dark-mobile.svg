<svg xmlns="http://www.w3.org/2000/svg" width="360" height="645" viewBox="0 0 360 645" role="img" aria-labelledby="title desc"><title id="title">A conceptual touch input path through the remote session, compositor and application.</title><desc id="desc">REMOTE INPUT / CONCEPTUAL PATH Input Session Compositor App 01 / Input Touch begins on the foldable display. 02 / Session The connection identifies its desktop session. 03 / Compositor Focus and coordinates resolve to a surface. 04 / Application The app receives the input it supports.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif}.flow{animation:flow 7s linear infinite}.scan{animation:scan 5s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-160}}@keyframes scan{0%,100%{opacity:.4}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.flow,.scan{animation:none}}</style><defs><linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3a5160"/><stop offset="1" stop-color="#253b48"/></linearGradient></defs><rect width="100%" height="100%" fill="#10151b"/><text x="22" y="31" fill="#a5b6c2" font-size="14" font-weight="400">REMOTE INPUT / CONCEPTUAL PATH</text><path d="M82 140H257V265H82" fill="none" stroke="#354957"/><path d="M82 140H257V265H82" fill="none" stroke="#8acee4" stroke-width="2" stroke-dasharray="18 142" class="flow"/><g transform="translate(82 112) scale(.72)" aria-hidden="true"><path d="M-82.56,-18.84L24.08,15.88L24.08,26.88L-82.56,-7.84Z" fill="#253b48" stroke="#354957" stroke-width=".8" stroke-linejoin="round"/><path d="M82.56,-3.16L82.56,7.84L24.08,26.88L24.08,15.88Z" fill="#172a35" stroke="#354957" stroke-width=".8" stroke-linejoin="round"/><path d="M-24.08,-37.88L82.56,-3.16L24.08,15.88L-82.56,-18.84Z" fill="url(#metal)" stroke="#354957" stroke-width=".8" stroke-linejoin="round"/><path d="M-43.00,-30.92L12.04,-13.00L12.04,-5.00L-43.00,-22.92Z" fill="#39758c"/><path d="M43.00,-23.08L43.00,-15.08L12.04,-5.00L12.04,-13.00Z" fill="#39758c"/><path d="M-12.04,-41.00L43.00,-